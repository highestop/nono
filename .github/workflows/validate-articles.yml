name: validate-articles

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "skills/markdown-article/**"
      - "skills/markdown-article-for-wx/**"
      - "skills/markdown-article-for-xhs/**"
      - "skills/markdown-article-for-x/**"
      - "skills/article-tags-review/**"
      - ".github/workflows/validate-articles.yml"
  pull_request:
    paths:
      - "articles/**/*.md"
      - "skills/markdown-article/**"
      - "skills/markdown-article-for-wx/**"
      - "skills/markdown-article-for-xhs/**"
      - "skills/markdown-article-for-x/**"
      - "skills/article-tags-review/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate article content
        run: python3 articles/__tests__/test-articles-content.py
