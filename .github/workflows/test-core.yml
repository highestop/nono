name: test-core

on:
  push:
    branches:
      - main
    paths:
      - "articles/core.js"
      - "articles/__tests__/test-core.js"
      - ".github/workflows/test-core.yml"
  pull_request:
    paths:
      - "articles/core.js"
      - "articles/__tests__/test-core.js"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test core logic
        run: node articles/__tests__/test-core.js
