name: generate-tags

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "scripts/generate-tags.py"
      - ".github/workflows/generate-tags.yml"

jobs:
  generate-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Get latest commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Generate tags.csv
        run: python3 scripts/generate-tags.py

      - name: Check for changes
        id: changes
        run: |
          if ! git diff --quiet articles/tags.csv 2>/dev/null || git ls-files --others --exclude-standard | grep -q "^articles/tags.csv$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add articles/tags.csv
          git commit -m "docs(articles): auto generate tags (${{ steps.commit.outputs.sha }})"
          git pull --rebase
          git push
