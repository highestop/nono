name: skill-sync

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'skills.json'
      - 'skills-lock.json'
      - '.gitignore'
      - '.github/workflows/skill-sync.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'skills.json'
      - 'skills-lock.json'
      - '.gitignore'
      - '.github/workflows/skill-sync.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check shell entry points
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Test skill synchronization
        run: python3 scripts/test_skill_sync.py -v
