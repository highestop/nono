name: skill-summary

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - '.github/workflows/skill-summary.yml'

jobs:
  auto-summary:
    if: ${{ ! github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get latest commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Generate SKILLS.md
        run: |
          # Create SKILLS.md header
          cat > SKILLS.md << 'EOF'
          # Skills

          | Skill | Description |
          |------|------|
          EOF

          # Process each skill
          for skill_dir in skills/*/; do
            if [ -d "$skill_dir" ] && [ -f "${skill_dir}SKILL.md" ]; then
              skill_name=$(basename "$skill_dir")

              # Extract description from YAML frontmatter
              description=$(awk '
                BEGIN { in_frontmatter = 0; description = "" }
                /^---$/ {
                  if (in_frontmatter == 0) {
                    in_frontmatter = 1
                  } else {
                    exit
                  }
                  next
                }
                in_frontmatter == 1 && /^description:/ {
                  sub(/^description: */, "")
                  # Remove quotes if present
                  gsub(/^["'"'"']|["'"'"']$/, "")
                  description = $0
                }
                END { print description }
              ' "${skill_dir}SKILL.md")

              # For empty description, leave second column empty
              # Create link to SKILL.md file
              skill_link="[$skill_name](skills/$skill_name/SKILL.md)"
              echo "| $skill_link | $description |" >> SKILLS.md
            fi
          done

          # Add footer with commit info
          cat >> SKILLS.md << EOF

          ---

          *This document was automatically generated based on commit [\`${{ steps.commit.outputs.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ steps.commit.outputs.sha }}).*
          EOF
      - name: Check for changes
        id: changes
        run: |
          # Check if SKILLS.md exists and has changes, or if it's a new file
          if [ ! -f SKILLS.md ] || ! git diff --quiet SKILLS.md || git ls-files --others --exclude-standard | grep -q "^SKILLS.md$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add SKILLS.md
          git commit -m "docs(skills): auto summary (${{ steps.commit.outputs.sha }})"
          git pull --rebase
          git push
